[project]
name = "pygmid"
version = "1.3.0"
description = "A python 3 implementation of the gm/ID starter kit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "auto-all>=1.4.1",
    "blab-pyutils",
    "coloredlogs>=15.0.1",
    "h5py>=3.16.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "prettytable>=3.17.0",
    "pyspice",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]

license = "Apache-2.0"
authors = [
    { name = "Cian Ó Domhnaill", email = "cian.odonnell@tyndall.ie" },
    { name = "Tiarnach Ó Riada" },
    { name = "Danylo Galach" },
]
urls = { "Homepage" = "https://github.com/madrasalach/pygmid", "Bug Tracker" = "https://github.com/madrasalach/pygmid/issues" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
sweep = [
    "pygmid-sweep",
]


[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]


[tool.uv]
package = true

[tool.uv.sources]
blab-pyutils = { path = "../blab_pyutils", editable = true }
pyspice = { path = "../PySpice", editable = true }
pygmid-sweep = { path = "../pygmid_sweep", editable = true }
